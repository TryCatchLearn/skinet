<div class="mx-auto">
    <h2 class="font-semibold text-2xl text-center">My orders</h2>
    <div class="flex flex-col w-full">
        <table class="divide-y divide-gray-300 cursor-pointer">
            <thead class="bg-gray-50">
                <tr class="uppercase font-light text-sm">
                    <th class="text-center px-6 py-3">Order</th>
                    <th class="text-left">Date</th>
                    <th class="text-left">Total</th>
                    <th class="text-left">Status</th>
                </tr>
            </thead>
            <tbody class="bg-(--mat-sys-surface)">
                @for (order of orderService.ordersResource.value(); track order.id) {
                    <tr routerLink="/orders/{{order.id}}" class="hover:bg-gray-100">
                        <th class="px-6 py-3"># {{order.id}}</th>
                        <td>{{order.orderDate | date: 'medium'}}</td>
                        <td>{{order.total | currency}}</td>
                        <td>
                            <mat-chip
                                [ngClass]="{
                                    'bg-green-100!': order.status === 'PaymentReceived',
                                    'bg-amber-100!': order.status === 'Pending'
                                }"
                            >
                                {{order.status | splitCamelCase}}
                            </mat-chip>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
