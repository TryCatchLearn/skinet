<mat-radio-group (change)="updateDeliveryMethod($event)" class="grid grid-cols-2 gap-4">
    @for (method of checkoutService.deliveryMethods(); track method.id) {
        <label class="p-3 w-full h-full border border-gray-300 rounded-xl cursor-pointer hover:bg-primary/20">
            <mat-radio-button
                [value]="method"
                [checked]="cartService.cartResource.value()?.deliveryMethodId === method.id"
            >
                <div class="flex flex-col">
                    <strong class="font-semibold">
                        {{method.shortName}} - {{method.price | currency}}
                    </strong>
                    <span class="text-xs">{{method.description}}</span>
                </div>
            </mat-radio-button>
        </label>
    }
</mat-radio-group>
