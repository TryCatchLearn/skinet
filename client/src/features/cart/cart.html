<section>
    @if (!cartService.cartResource.value()) {
    <app-empty-state message="Your shopping cart is empty" icon="remove_shopping_cart" actionText="Go to shop"
        (action)="onAction()" />
    } @else {
    <div class="mx-10">
        <div class="flex w-full items-start gap-6">
            <div class="w-3/4">
                @for (item of cartService.cartResource.value()?.items; track item.productId) {
                <app-cart-item [item]="item" />
                }
            </div>
            <div class="w-1/4">
                <app-order-summary />
            </div>
        </div>
    </div>
    }

</section>
