                alt="image of {{product.name}}" 
                class="rounded-t-xl" 
                height="600"

            <div>
                <h1 class="text-2xl font-semibold">{{product.name}}</h1>
                <div class="mt-4 items-center flex">
                    <p class="text-3xl font-extrabold">
                        {{product.price | currency}}
                    </p>
                </div>
                <div class="flex gap-4 mt-6">
                    <button (click)="updateCart()"
                        [disabled]="(quantity() === quantityInCart()) || cartService.loading()" mat-flat-button
                        class="h-14!">
                        <mat-icon>shopping_cart</mat-icon>
                        {{quantityInCart() > 0 ? 'Update cart' : 'Add to cart'}}
                    </button>
                    <mat-form-field appearance="outline" class="flex">
                        <mat-label>Quantity</mat-label>
                        <input matInput type="number" [formField]="quantityField">
                    </mat-form-field>
                </div>

                @if (quantityInCart() > 0) {
                <p class="font-light text-sm">
                    {{quantityInCart()}} already in your cart
                </p>
                }

                <mat-divider class="my-6!" />

                <p>
                    {{product.description}}
                </p>
            </div>
        </div>
    </div>
</section>
}
